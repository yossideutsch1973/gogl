name: ci-go
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Install OpenGL and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libgl1-mesa-dri xorg-dev xvfb mesa-utils
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
      - name: Run tests
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: go test ./tests/unit/...
      - name: Build examples
        run: go build ./cmd/examples/...
